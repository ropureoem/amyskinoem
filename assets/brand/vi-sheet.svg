ial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A">White</text><text x="265" y="540" font-family="Arial, sans-serif" font-size="15" letter-spacing="1" fill="#333333">#FFFFFF</text><text x="265" y="562" font-family="Arial, sans-serif" font-size="13" fill="#8A8378">Backgrounds</text><text x="450" y="515" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A">Charcoal</text><text x="450" y="540" font-family="Arial, sans-serif" font-size="15" letter-spacing="1" fill="#333333">#333333</text><text x="450" y="562" font-family="Arial, sans-serif" font-size="13" fill="#8A8378">Subheads</text><text x="634" y="515" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A">Warm Grey</text><text x="634" y="540" font-family="Arial, sans-serif" font-size="15" letter-spacing="1" fill="#333333">#8A8378</text><text x="634" y="562" font-family="Arial, sans-serif" font-size="13" fill="#8A8378">Captions</text><text x="819" y="515" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A">Ivory</text><text x="819" y="540" font-family="Arial, sans-serif" font-size="15" letter-spacing="1" fill="#333333">#FAF8F5</text><text x="819" y="562" font-family="Arial, sans-serif" font-size="13" fill="#8A8378">Page ground</text><text x="1004" y="515" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#1A1A1A">Line</text><text x="1004" y="540" font-family="Arial, sans-serif" font-size="15" letter-spacing="1" fill="#333333">#E5E0D5</text><text x="1004" y="562" font-family="Arial, sans-serif" font-size="13" fill="#8A8378">Rules &amp; borders</text><text x="80" y="640" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="3" fill="#1A1A1A">02 — TYPE</text><text x="80" y="700" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#333333"><tspan font-weight="700" fill="#1A1A1A">Typeface — </tspan>Arial / Helvetica</text><text x="80" y="745" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#333333"><tspan font-weight="700" fill="#1A1A1A">Wordmark — </tspan>Light 300, tracking 12</text><text x="80" y="790" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#333333"><tspan font-weight="700" fill="#1A1A1A">Headings — </tspan>Bold 700, sentence case</text><text x="80" y="835" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#333333"><tspan font-weight="700" fill="#1A1A1A">Body — </tspan>Regular 400, 16 px / 1.65</text><rect x="620" y="678" width="540" height="180" fill="#FFFFFF" stroke="#E5E0D5" stroke-width="1"/><text x="650" y="762" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="700" fill="#1A1A1A">Aa</text><text x="650" y="806" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="300" letter-spacing="6" fill="#1A1A1A">AMY SKIN</text><text x="650" y="838" font-family="Arial, sans-serif" font-size="15" fill="#8A8378">The quick brown fox jumps over the lazy dog.</text><text x="80" y="960" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="3" fill="#1A1A1A">03 — CLEAR SPACE &amp; MINIMUM SIZE</text><rect x="80" y="1000" width="500" height="200" fill="#FFFFFF" stroke="#E5E0D5" stroke-width="1"/><rect x="225" y="1045" width="210" height="135" fill="none" stroke="#8A8378" stroke-width="1.5" stroke-dasharray="6 4"/><text x="330" y="1035" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#8A8378">x</text><text x="212" y="1120" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#8A8378">x</text><text x="330" y="1095" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="300" letter-spacing="6" fill="#1A1A1A">AMY SKIN</text><text x="330" y="1125" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" letter-spacing="3" fill="#1A1A1A">SKINCARE</text><line x1="290" y1="1142" x2="370" y2="1142" stroke="#1A1A1A" stroke-width="0.75"/><text x="80" y="1235" font-family="Arial, sans-serif" font-size="15" fill="#8A8378">Clear space = one cap height of "A" (x) on all sides.</text><text x="620" y="1040" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#1A1A1A">Minimum size</text><text x="620" y="1080" font-family="Arial, sans-serif" font-size="17" fill="#333333">Print — 20 mm wide minimum</text><text x="620" y="1112" font-family="Arial, sans-serif" font-size="17" fill="#333333">Screen — 100 px wide minimum</text><text x="620" y="1144" font-family="Arial, sans-serif" font-size="17" fill="#333333">Never below 60 px on screen</text><text x="620" y="1185" font-family="Arial, sans-serif" font-size="15" fill="#8A8378">Below these sizes, use the narrow logo or the avatar mark.</text><text x="80" y="1300" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="3" fill="#1A1A1A">04 — DO &amp; DON'T</text><text x="80" y="1352" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#1A1A1A">DO</text><text x="80" y="1397" font-family="Arial, sans-serif" font-size="17" fill="#333333"><tspan fill="#1A1A1A">✓  </tspan>Use Ink on light, White on Ink</text><text x="80" y="1434" font-family="Arial, sans-serif" font-size="17" fill="#333333"><tspan fill="#1A1A1A">✓  </tspan>Keep one cap-height of clear space</text><text x="80" y="1471" font-family="Arial, sans-serif" font-size="17" fill="#333333"><tspan fill="#1A1A1A">✓  </tspan>Use the supplied logo files</text><text x="80" y="1508" font-family="Arial, sans-serif" font-size="17" fill="#333333"><tspan fill="#1A1A1A">✓  </tspan>Place on plain, calm backgrounds</text><text x="620" y="1352" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#1A1A1A">DON'T</text><text x="620" y="1397" font-family="Arial, sans-serif" font-size="17" fill="#333333"><tspan fill="#1A1A1A">✕  </tspan>Do not recolour the wordmark</text><text x="620" y="1434" font-family="Arial, sans-serif" font-size="17" fill="#333333"><tspan fill="#1A1A1A">✕  </tspan>Do not re-set or re-space the letters</text><text x="620" y="1471" font-family="Arial, sans-serif" font-size="17" fill="#333333"><tspan fill="#1A1A1A">✕  </tspan>Do not stretch or compress</text><text x="620" y="1508" font-family="Arial, sans-serif" font-size="17" fill="#333333"><tspan fill="#1A1A1A">✕  </tspan>Do not place over busy photography</text><line x1="80" y1="1580" x2="1160" y2="1580" stroke="#E5E0D5" stroke-width="1.5"/><text x="620" y="1620" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#333333">Amy Skin OEM · amyskinoem.com · WhatsApp +86 189 2882 3858 · info@amyskinoem.com</text><text x="620" y="1655" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#8A8378">Kit files — assets/brand/: logo-main · logo-reverse · logo-narrow · logo-stacked · avatar · banner · whatsapp · mockup-serum · mockup-cream · mockup-mask · vi-sheet (.svg)</text></svg>
